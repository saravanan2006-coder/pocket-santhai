{% extends "base.html" %}
{% block title %}Add Stock - சந்தை{% endblock %}
{% block content %}
<div class="page-content" style="max-width:700px;">
    <div class="page-card fade-in">
        <h3 style="margin-bottom:0.25rem;"><i class="fas fa-plus-circle" style="color:var(--mustard);"></i> Add New Stock Item</h3>
        <p class="tamil" style="color:var(--brown);font-size:0.9rem;margin-bottom:1.5rem;">புதிய சரக்கு சேர்க்க</p>
        <form method="post">
            {% csrf_token %}
            <div class="grid-2">
                <div class="form-group">
                    <label>Item Name</label>
                    {{ form.name }}
                </div>
                <div class="form-group">
                    <label>Category</label>
                    {{ form.category }}
                </div>
            </div>
            <div class="grid-3">
                <div class="form-group">
                    <label>Price (₹)</label>
                    {{ form.price }}
                </div>
                <div class="form-group">
                    <label>Unit</label>
                    {{ form.unit }}
                </div>
                <div class="form-group">
                    <label>Quantity</label>
                    {{ form.quantity }}
                </div>
            </div>
            <div class="form-group">
                <label>Description</label>
                {{ form.description }}
            </div>
            <div style="display:flex;gap:0.75rem;margin-top:1.5rem;flex-wrap:wrap;">
                <button type="submit" class="btn-submit"><i class="fas fa-save"></i> Save Item</button>
                <a href="{% url 'seller_dashboard' %}" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
