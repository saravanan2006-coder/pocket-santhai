{% extends "base.html" %}
{% block title %}Edit Stock - சந்தை{% endblock %}
{% block content %}
<div class="page-content" style="max-width:700px;">
    <div class="page-card">
        <h3 style="margin-bottom:0.25rem;"><i class="fas fa-edit" style="color:var(--mustard);"></i> Edit: {{ item.name }}</h3>
        <p class="tamil" style="color:var(--brown);font-size:0.9rem;margin-bottom:1.5rem;">சரக்கு திருத்த</p>
        <form method="post">
            {% csrf_token %}
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                <div class="form-group">
                    <label>Item Name</label>
                    {{ form.name }}
                </div>
                <div class="form-group">
                    <label>Category</label>
                    {{ form.category }}
                </div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;">
                <div class="form-group">
                    <label>Price (₹)</label>
                    {{ form.price }}
                </div>
                <div class="form-group">
                    <label>Unit</label>
                    {{ form.unit }}
                </div>
                <div class="form-group">
                    <label>Quantity</label>
                    {{ form.quantity }}
                </div>
            </div>
            <div class="form-group">
                <label>Description</label>
                {{ form.description }}
            </div>
            <div style="display:flex;gap:0.75rem;margin-top:1.5rem;">
                <button type="submit" class="btn-submit"><i class="fas fa-save"></i> Update Item</button>
                <a href="{% url 'seller_dashboard' %}" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
