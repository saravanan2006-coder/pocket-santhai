{% extends "base.html" %}
{% block title %}Login - WholeSync{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div style="text-align:center;margin-bottom:1.5rem;">
            <span style="font-size:1.5rem;font-weight:800;color:var(--terracotta);">WholeSync</span>
            <h3 style="margin-top:0.5rem;color:var(--charcoal);font-weight:700;">Login</h3>
            <p style="color:var(--brown);font-size:0.9rem;margin-top:0.25rem;">Sign in to your account</p>
        </div>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter your username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div style="position:relative;">
                    <input type="password" id="loginPassword" name="password" placeholder="Enter your password" required style="padding-right:2.8rem;">
                    <button type="button" class="password-toggle" data-target="loginPassword" aria-label="Show password" style="position:absolute; right:0.75rem; top:50%; transform:translateY(-50%); border:none; background:transparent; color:var(--brown); cursor:pointer; font-size:0.9rem;">Show</button>
                </div>
            </div>
            {% if form.errors %}
            <div class="alert alert-danger" style="padding:0.75rem;border-radius:10px;font-size:0.85rem;margin-bottom:1rem;">
                <i class="fas fa-exclamation-circle"></i> Invalid username or password.
            </div>
            {% endif %}
            <button type="submit" class="btn-primary-full">Login</button>
        </form>
        <p style="text-align:center;margin-top:1.25rem;font-size:0.9rem;color:var(--brown);">
            Don't have an account? <a href="{% url 'register' %}" class="link-primary">Register</a>
        </p>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('.password-toggle').forEach(function (button) {
            button.addEventListener('click', function () {
                const target = document.getElementById(button.dataset.target);
                if (!target) return;
                const isPassword = target.type === 'password';
                target.type = isPassword ? 'text' : 'password';
                button.textContent = isPassword ? 'Hide' : 'Show';
                button.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
            });
        });
    });
</script>
{% endblock %}
